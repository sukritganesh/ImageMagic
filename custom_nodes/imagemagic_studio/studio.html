<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ImageMagic • Local studio</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--paper:#f4f2e9;--ink:#181a17;--muted:#a8aaa1;--lime:#d4fc76}
body{margin:0;background:#121410;color:var(--paper);font:16px Inter,"Segoe UI",sans-serif}
main,header{width:min(1100px,92vw);margin:auto}
header{display:flex;align-items:center;gap:11px;padding:24px 0;border-bottom:1px solid #353832;font-weight:650}
.mark{width:24px;height:24px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--lime) 0 4px,#22291d 4px 7px)}
header a{margin-left:auto;color:var(--muted);font-size:13px;text-decoration:none}
h1{font-size:clamp(40px,6vw,72px);font-weight:520;letter-spacing:-.065em;margin:42px 0 18px}
form{border:1px solid #474b42;background:#20231d;border-radius:18px;padding:17px}
form:focus-within{border-color:#89997a}
textarea{width:100%;resize:vertical;min-height:98px;border:0;background:transparent;color:var(--paper);font:inherit;font-size:19px;line-height:1.5;padding:4px 5px}
textarea::placeholder{color:#a8aa9e}
.controls,.caption,.section{display:flex;align-items:center;gap:12px}
.controls{flex-wrap:wrap;padding-top:12px;border-top:1px solid #393d34}
label{color:var(--muted);font-size:13px}
select,button{font:inherit;border-radius:9px;padding:10px 14px}
select{color:var(--paper);background:#2c3028;border:1px solid #4a5043;font-size:14px}
button{background:var(--lime);color:var(--ink);font-weight:700;border:0;cursor:pointer;margin-left:auto}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.status{margin:8px 2px 0;font-size:14px;color:var(--muted);min-height:20px}
.section{justify-content:space-between;margin:24px 0 14px}
h2{font-weight:520;letter-spacing:-.04em;font-size:27px;margin:0}
#count,.caption{font:12px "Cascadia Mono",Consolas,monospace;color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:48px}
article{display:flex;flex-direction:column;min-width:0;border-radius:12px;overflow:hidden;background:#20231d;border:1px solid #353a30}
article:hover,article:focus-within{border-color:#89997a}
.open-card,.expand-photo{display:block;width:100%;padding:0;margin:0;background:transparent;color:inherit;text-align:left;font:inherit;border-radius:0}
.open-card{flex:1;align-content:start}
.expand-photo{cursor:zoom-in}
.open-card:focus-visible,.expand-photo:focus-visible{outline-offset:-3px}
.picture{position:relative}
article img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.card-prompt{font-size:15px;line-height:1.45;margin:12px 14px 8px;overflow-wrap:anywhere;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
.pager{display:flex;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.picture .pager{position:absolute;bottom:8px;right:8px;z-index:2;background:#11170ff2;padding:3px;border-radius:9px}
.quiet{margin:0;background:#30352c;color:var(--paper);font-size:14px;padding:7px 11px}
.quiet:disabled{cursor:default;opacity:.35}
.pager button{padding:5px 8px}
[hidden]{display:none!important}
dialog{width:min(1060px,94vw);max-height:90dvh;overflow:auto;background:#181c16;color:var(--paper);border:1px solid #505748;border-radius:18px;padding:clamp(14px,2vw,26px)}
dialog::backdrop{background:#080a08d9}
body:has(dialog[open]){overflow:hidden}
.dialog-head,.version-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dialog-head{margin-bottom:18px}
.detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:22px}
.photos{display:flex;gap:8px;align-items:center}
figure{margin:0;flex:1;min-width:0}
figure img{display:block;width:100%;border-radius:8px}
figcaption,.detail label{font-size:13px;color:var(--muted);margin-top:6px}
.version-controls{margin-top:12px}
#description{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:0 0 18px}
#editForm{padding:12px}
#instruction{min-height:80px;font-size:16px}
#editForm button{display:block}
@media(max-width:740px){.detail{grid-template-columns:1fr}.photos{max-width:540px;margin:auto}.picture .pager{gap:3px;right:3px;bottom:3px}.picture .pager button{padding:4px}}
.caption{margin:0 14px 16px;justify-content:space-between;flex-wrap:wrap;gap:4px}
#empty{color:var(--muted)}
@media(max-width:600px){#grid{gap:7px}.caption{font-size:10px;margin:6px}.card-prompt{font-size:12px;margin:6px}.controls{gap:6px}select,button{padding:9px}.section{margin-top:15px}}
#lightbox{position:fixed;inset:0;box-sizing:border-box;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:12px 60px;border:0;border-radius:0;overflow:hidden;background:#0b0d0af7;outline:none}
#photoStage{height:100%;display:grid;place-items:center;overflow:hidden;touch-action:none}
#largePhoto{display:block;max-width:none;user-select:none;touch-action:none}
#largePhoto.pannable{cursor:grab}
#largePhoto.dragging{cursor:grabbing}
.zoom-tools,#largeClose,#largeVersions{position:absolute;z-index:1}
.zoom-tools{right:8px;top:50%;transform:translateY(-50%);display:grid;gap:6px}
#largeClose{right:8px;top:12px}
#lightbox button{width:42px;height:42px;padding:0;margin:0;border:1px solid #62665a;border-radius:10px;background:#1e231df5;color:var(--paper);font-size:21px;line-height:1}
#lightbox button:disabled{cursor:default;opacity:.45}
#largeVersions{bottom:17px;left:50%;transform:translateX(-50%);background:#151914ee;border-radius:12px;padding:3px 4px}
@media(max-width:600px){#lightbox{padding:55px 8px 62px}.zoom-tools{top:8px;right:58px;transform:none;display:flex}#largeClose{top:8px}}
</style>
<header><span class="mark" aria-hidden="true"></span>ImageMagic<a href="/" target="_blank" rel="noopener">Open ComfyUI ↗</a></header>
<main>
<h1>Image studio</h1>
<form id="composer">
  <textarea id="prompt" aria-label="Image prompt" placeholder="Describe the image you want to make…" required maxlength="8000"></textarea>
  <div class="controls"><label for="model">Model</label><select id="model"></select><button id="generate" disabled>Generate ↗</button></div>
</form>
<div class="status" id="status" role="status"></div>
<div class="section"><h2>Your images</h2><span id="count"></span></div>
<p id="empty" hidden>Your first image will appear here.</p><div id="grid"></div>
</main>
<dialog id="viewer" aria-labelledby="detailTitle">
  <div class="dialog-head"><h2 id="detailTitle">Image details</h2><button id="closeViewer" class="quiet" autofocus>Close ✕</button></div>
  <div class="detail">
    <div>
      <div class="photos">
        <figure id="originalFigure" hidden><button class="expand-photo" id="expandOriginal" aria-label="Expand original image" aria-haspopup="dialog"><img id="originalPhoto" alt="Original image"></button><figcaption>Original</figcaption></figure>
        <figure><button class="expand-photo" id="expandDetail" aria-label="Expand selected image" aria-haspopup="dialog"><img id="detailPhoto" alt=""></button><figcaption id="versionLabel"></figcaption></figure>
      </div>
      <div class="version-controls"><div id="modalPager" class="pager"></div><button class="quiet" id="compare" hidden></button></div>
    </div>
    <div>
      <h3 id="promptHeading">Prompt</h3><p id="description"></p>
      <form id="editForm"><label for="instruction">Edit this version</label>
        <textarea id="instruction" placeholder="What would you like to change?" maxlength="8000" required></textarea>
        <button id="saveEdit">Generate edit ↗</button>
      </form>
      <div id="editStatus" class="status" role="status"></div>
    </div>
  </div>
</dialog>
<dialog id="lightbox" aria-label="Image viewer" tabindex="-1">
  <div id="photoStage"><img id="largePhoto" alt="" draggable="false"></div>
  <button id="largeClose" aria-label="Close image viewer" title="Close (Esc)">×</button>
  <div class="zoom-tools">
    <button id="zoomIn" aria-label="Zoom in" title="Zoom in (+)">+</button>
    <button id="zoomOut" aria-label="Zoom out" title="Zoom out (−)">−</button>
  </div>
  <div id="largeVersions" class="pager" hidden>
    <button id="largePrev" aria-label="Previous version" title="Previous version (←)">←</button>
    <span id="largePosition" aria-live="polite"></span>
    <button id="largeNext" aria-label="Next version" title="Next version (→)">→</button>
  </div>
</dialog>
<script>
const $ = id => document.getElementById(id);
const text = (tag, value) => Object.assign(document.createElement(tag), {textContent:value});
let previous = null, pending = new Set(JSON.parse(sessionStorage.getItem('pending') || '[]'));
const missing = new Set();
const groups = new Map();
const edits = new Map(JSON.parse(sessionStorage.getItem('studioEdits') || '[]'));
const editMessages = new Map();
let opened = null, compareOriginal = true;
function savePending(){sessionStorage.setItem('pending', JSON.stringify([...pending]))}
async function json(url, options){
  const response = await fetch(url, options);
  if(!response.ok) throw Error((await response.text()).slice(0,500) || response.statusText);
  return response.json();
}
function imageUrl(item){
  return '/view?'+new URLSearchParams({filename:item.file,subfolder:'ImageMagic',type:'output'});
}
const lightbox=$('lightbox'), stage=$('photoStage'), largePhoto=$('largePhoto');
const minZoom=0.25, maxZoom=8;
let photoGroup=null, photoFile=null, zoom=1, panX=0, panY=0, drag=null;

function layoutPhoto(){
  if(!lightbox.open || !largePhoto.naturalWidth) return;
  const fit=Math.min(stage.clientWidth/largePhoto.naturalWidth,stage.clientHeight/largePhoto.naturalHeight);
  const width=largePhoto.naturalWidth*fit, height=largePhoto.naturalHeight*fit;
  const limitX=Math.max(0,(width*zoom-stage.clientWidth)/2);
  const limitY=Math.max(0,(height*zoom-stage.clientHeight)/2);
  panX=Math.max(-limitX,Math.min(limitX,panX));
  panY=Math.max(-limitY,Math.min(limitY,panY));
  largePhoto.style.width=width+'px';
  largePhoto.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';
  largePhoto.classList.toggle('pannable',limitX>0 || limitY>0);
  $('zoomOut').disabled=zoom<=minZoom;
  $('zoomIn').disabled=zoom>=maxZoom;
}
function changeZoom(factor, anchorX=0, anchorY=0){
  const next=Math.max(minZoom,Math.min(maxZoom,zoom*factor));
  panX=anchorX+(panX-anchorX)*next/zoom;
  panY=anchorY+(panY-anchorY)*next/zoom;
  zoom=next;
  layoutPhoto();
}
function showPhoto(item){
  photoFile=item.file;
  largePhoto.alt=item.prompt;
  const url=imageUrl(item);
  if(largePhoto.getAttribute('src')!==url) largePhoto.src=url;
  const versions=photoGroup.versions, index=versions.indexOf(item);
  $('largeVersions').hidden=versions.length<2;
  $('largePrev').disabled=index===0;
  $('largeNext').disabled=index===versions.length-1;
  $('largePosition').textContent=(index+1)+' / '+versions.length;
  layoutPhoto();
}
function openPhoto(group,item){
  photoGroup=group;
  zoom=1; panX=0; panY=0;
  lightbox.showModal();
  showPhoto(item);
}
function stepPhoto(direction){
  const versions=photoGroup.versions;
  const index=versions.findIndex(item=>item.file===photoFile);
  const next=versions[index+direction];
  if(next) showPhoto(next);
}
$('expandOriginal').onclick=()=>openPhoto(opened,opened.versions.find(item=>item.file===opened.root));
$('expandDetail').onclick=()=>openPhoto(opened,opened.versions[opened.index]);
$('largePrev').onclick=()=>stepPhoto(-1);
$('largeNext').onclick=()=>stepPhoto(1);
$('zoomIn').onclick=()=>changeZoom(1.25);
$('zoomOut').onclick=()=>changeZoom(1/1.25);
$('largeClose').onclick=()=>lightbox.close();
lightbox.onclick=event=>{
  if(event.target===lightbox || event.target===stage) lightbox.close();
};
lightbox.onclose=()=>{photoGroup=null; drag=null; largePhoto.classList.remove('dragging')};
lightbox.onkeydown=event=>{
  if(event.altKey || event.ctrlKey || event.metaKey) return;
  switch(event.key){
    case 'ArrowLeft': stepPhoto(-1); break;
    case 'ArrowRight': stepPhoto(1); break;
    case '+': case '=': changeZoom(1.25); break;
    case '-': changeZoom(1/1.25); break;
    default: return;
  }
  event.preventDefault();
};
stage.addEventListener('wheel',event=>{
  event.preventDefault();
  const bounds=stage.getBoundingClientRect();
  const unit=event.deltaMode===1?16:event.deltaMode===2?stage.clientHeight:1;
  const delta=Math.max(-200,Math.min(200,event.deltaY*unit));
  changeZoom(Math.exp(-delta*0.002),event.clientX-bounds.left-bounds.width/2,event.clientY-bounds.top-bounds.height/2);
},{passive:false});
largePhoto.onpointerdown=event=>{
  if(event.button!==0 || !event.isPrimary || !largePhoto.classList.contains('pannable')) return;
  drag={id:event.pointerId,x:event.clientX-panX,y:event.clientY-panY};
  largePhoto.setPointerCapture(event.pointerId);
  largePhoto.classList.add('dragging');
};
largePhoto.onpointermove=event=>{
  if(drag?.id!==event.pointerId) return;
  panX=event.clientX-drag.x; panY=event.clientY-drag.y; layoutPhoto();
};
largePhoto.onlostpointercapture=()=>{drag=null; largePhoto.classList.remove('dragging')};
largePhoto.onload=layoutPhoto;
new ResizeObserver(layoutPhoto).observe(stage);
function pager(container, group){
  const total=group.versions.length;
  container.hidden=total<2;
  if(total<2) return;
  if(!container.children.length){
    for(const [label, step] of [['Previous version',-1],['Next version',1]]){
      const button=text('button',step<0?'←':'→');
      button.type='button'; button.className='quiet'; button.setAttribute('aria-label',label);
      button.addEventListener('click',()=>{
        const current=groups.get(container.dataset.root);
        current.index=Math.max(0,Math.min(current.index+step,current.versions.length-1));
        paint(current);
      });
      container.append(button);
      if(step<0) container.append(text('span',''));
    }
  }
  container.dataset.root=group.root;
  const [prev,position,next]=container.children;
  prev.disabled=group.index===0; next.disabled=group.index===total-1;
  position.textContent=(group.index+1)+' / '+total;
}
function makeCard(group){
  const card=document.createElement('article');
  card.innerHTML='<div class="picture"><button class="expand-photo" aria-haspopup="dialog"><img alt="" loading="lazy"></button><div class="pager"></div></div><button class="open-card" aria-haspopup="dialog"><span class="card-prompt"></span><span class="caption"><span></span><span></span></span></button>';
  card.querySelector('.expand-photo').onclick=()=>openPhoto(group,group.versions[group.index]);
  card.querySelector('.caption').title='Time from submission to saved PNG, including queue time';
  card.querySelector('.open-card').onclick=()=>{
    opened=group; compareOriginal=true; $('instruction').value='';
    renderDetails(); $('viewer').showModal();
  };
  return card;
}
function renderDetails(){
  const group=opened, item=group.versions[group.index];
  const original=group.versions.find(v=>v.file===group.root);
  const canCompare=!!original && item.file!==group.root;
  $('detailPhoto').src=imageUrl(item); $('detailPhoto').alt=item.prompt;
  $('originalFigure').hidden=!(canCompare && compareOriginal);
  if(!$('originalFigure').hidden) $('originalPhoto').src=imageUrl(original);
  $('compare').hidden=!canCompare;
  $('compare').textContent=compareOriginal?'View edit only':'Compare with original';
  $('versionLabel').textContent=item.parent?'Version '+(group.index+1):'Original';
  $('promptHeading').textContent=item.parent?'Edit instruction':'Prompt';
  $('description').textContent=item.prompt;
  $('editStatus').textContent=editMessages.get(group.root) || '';
  pager($('modalPager'),group);
}
function paint(group){
  const item=group.versions[group.index], card=group.card;
  card.querySelector('img').src=imageUrl(item);
  card.querySelector('.card-prompt').textContent=item.prompt;
  card.querySelector('.open-card').setAttribute('aria-label','Image details: '+item.prompt);
  card.querySelector('.expand-photo').setAttribute('aria-label','Expand image: '+item.prompt);
  const [model,elapsed]=card.querySelector('.caption').children;
  model.textContent=item.model; elapsed.textContent=item.seconds.toFixed(1)+' s';
  pager(card.querySelector('.pager'),group);
  if(opened===group) renderDetails();
}
function updateGallery(items){
  const families=new Map();
  for(const item of [...items].reverse()){
    const root=item.original || item.file;
    if(!families.has(root)) families.set(root,[]);
    families.get(root).push(item);
  }
  for(const [root,group] of groups){
    if(families.has(root)) continue;
    if(photoGroup===group) lightbox.close();
    if(opened===group) $('viewer').close();
    group.card.remove(); groups.delete(root);
  }
  let position=0;
  for(const [root,versions] of [...families].reverse()){
    let group=groups.get(root);
    if(!group){
      group={root,versions:[],index:0};
      group.card=makeCard(group); groups.set(root,group);
    }
    const selected=group.versions[group.index]?.file;
    const sameLatest=group.versions.at(-1)?.file===versions.at(-1).file;
    const index=sameLatest?versions.findIndex(v=>v.file===selected):-1;
    group.versions=versions; group.index=index<0?versions.length-1:index;
    const slot=$('grid').children[position++] || null;
    if(slot!==group.card) $('grid').insertBefore(group.card,slot);
    paint(group);
    if(photoGroup===group && lightbox.open){
      showPhoto(versions.find(item=>item.file===photoFile) || versions[group.index]);
    }
  }
  $('count').textContent=groups.size+' '+(groups.size===1?'image':'images');
  $('empty').hidden=!!groups.size;
}
function finishEdit(id,message){
  const root=edits.get(id);
  if(!root) return;
  edits.delete(id); sessionStorage.setItem('studioEdits',JSON.stringify([...edits]));
  editMessages.set(root,message);
  if(opened?.root===root) $('editStatus').textContent=message;
}
async function refresh(){
  const items=await json('/studio/api/gallery'), signature=items.map(x=>x.file).join(',');
  if(signature!==previous){
    updateGallery(items); previous=signature;
  }
  for(const id of [...pending]){
    const entry=(await json('/history/'+encodeURIComponent(id)))[id];
    if(!entry){
      const queue=await json('/queue');
      const active=[...queue.queue_running,...queue.queue_pending].some(job=>job[1]===id);
      if(active){missing.delete(id);continue}
      if(!missing.has(id)){missing.add(id);continue}
      missing.delete(id); pending.delete(id); savePending();
      $('status').textContent='Queue cleared. Saved images are in the gallery.';
      finishEdit(id,$('status').textContent);
      continue;
    }
    pending.delete(id); savePending();
    const error=entry.status.messages.find(x=>x[0]==='execution_error');
    $('status').textContent=error?'Generation failed. '+error[1].exception_message:
      entry.status.status_str==='success'?'Image saved.':'Generation interrupted.';
    finishEdit(id,$('status').textContent);
  }
  if(pending.size) $('status').textContent=pending.size+' '+(pending.size===1?'image':'images')+' queued or generating…';
}
async function poll(){
  try{await refresh()}catch(e){$('status').textContent='Studio connection interrupted. Reconnecting…'}
  setTimeout(poll, pending.size?1000:3500);
}
$('composer').onsubmit=async e=>{
  e.preventDefault();
  const prompt=$('prompt').value.trim(); if(!prompt || $('generate').disabled) return;
  $('generate').disabled=true;
  try{
    const job=await json('/studio/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,model:$('model').value})});
    pending.add(job.prompt_id); savePending(); $('status').textContent='Image queued…'; $('prompt').select();
  }catch(e){$('status').textContent='Could not submit. '+e.message}
  finally{$('generate').disabled=false}
};
$('closeViewer').onclick=()=>$('viewer').close();
$('viewer').addEventListener('close',()=>{opened=null});
$('compare').onclick=()=>{compareOriginal=!compareOriginal; renderDetails()};
$('editForm').onsubmit=async event=>{
  event.preventDefault();
  const group=opened, source=group.versions[group.index].file, prompt=$('instruction').value.trim();
  if(!prompt || $('saveEdit').disabled) return;
  $('saveEdit').disabled=true;
  try{
    const job=await json('/studio/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source,prompt})});
    pending.add(job.prompt_id); edits.set(job.prompt_id,group.root);
    savePending(); sessionStorage.setItem('studioEdits',JSON.stringify([...edits]));
    editMessages.set(group.root,'Generating a new version…');
    if(opened===group){$('instruction').value=''; compareOriginal=true}
  }catch(e){editMessages.set(group.root,'Could not submit. '+e.message)}
  finally{
    $('saveEdit').disabled=false;
    if(opened===group) renderDetails();
  }
};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) $('composer').requestSubmit()};
async function init(){
  try{
    const models=await json('/studio/api/models');
    for(const [key,name] of Object.entries(models)) $('model').add(new Option(name,key));
    $('generate').disabled=!$('model').length; if(!$('model').length) $('status').textContent='Waiting for model files.';
  }catch(e){$('status').textContent=e.message}
  poll();
}
init();
</script>
</html>
