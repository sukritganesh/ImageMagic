<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sessions · ImageMagic</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="/studio/favicon.svg">
<link rel="stylesheet" href="/studio/style.css">
<header><img src="/studio/favicon.svg" width="24" height="24" alt="">ImageMagic<a href="/" target="_blank" rel="noopener">Open ComfyUI ↗</a></header>
<main class="sessions-home">
  <h1>Sessions</h1>
  <form class="create-session" action="/studio/sessions" method="post">
    <label for="sessionName">New session name</label>
    <div><input id="sessionName" name="name" required maxlength="80" pattern=".*\S.*" autocomplete="off" placeholder="e.g. Woodland sketches"><button>Create session</button></div>
  </form>
  {{sessions}}
</main>
<dialog id="confirmDelete" aria-labelledby="deleteTitle" aria-describedby="deleteExplanation">
  <h2 id="deleteTitle"></h2>
  <p id="deleteExplanation" aria-live="polite"></p>
  <div class="confirm-actions">
    <button id="cancelDelete" class="quiet" autofocus>Cancel</button>
    <button id="confirmAction" disabled>Delete permanently</button>
  </div>
</dialog>
<script>
const dialog = document.getElementById('confirmDelete');
const explanation = document.getElementById('deleteExplanation');
const confirmButton = document.getElementById('confirmAction');
let selected;

async function review(session, notice = '') {
  confirmButton.disabled = true;
  session.revision = null;
  explanation.textContent = 'Counting images…';
  try {
    const response = await fetch(session.url + '/deletion');
    if (!response.ok) throw new Error(await response.text());
    const {images, trashed, revision} = await response.json();
    if (selected !== session || !dialog.open) return;
    const count = images + (images === 1 ? ' saved image' : ' saved images');
    const trash = trashed ? ' and ' + trashed + ' more in trash' : '';
    explanation.textContent = notice + 'This session contains ' + count + trash +
      '. Each saved version counts as one image. Deleting the session is permanent.';
    session.revision = revision;
    confirmButton.disabled = false;
  } catch (error) {
    if (selected === session) explanation.textContent = error.message;
  }
}

document.querySelector('.session-list')?.addEventListener('click', event => {
  const button = event.target.closest('button[data-session]');
  if (!button) return;
  const name = button.closest('li').querySelector('a span').textContent;
  selected = {url: '/studio/api/sessions/' + button.dataset.session};
  document.getElementById('deleteTitle').textContent = 'Delete “' + name + '”?';
  dialog.showModal();
  review(selected);
});

confirmButton.onclick = async () => {
  const session = selected;
  if (!session.revision || confirmButton.disabled) return;
  confirmButton.disabled = true;
  try {
    const response = await fetch(session.url + '/delete', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({revision: session.revision})
    });
    if (response.ok) {
      location.reload();
      return;
    }
    const message = await response.text();
    if (selected !== session || !dialog.open) return;
    if (response.status === 409) {
      await review(session, message + ' ');
      return;
    }
    throw new Error(message);
  } catch (error) {
    if (selected === session) explanation.textContent = error.message;
  }
};

document.getElementById('cancelDelete').onclick = () => dialog.close();
function outside(event) {
  const r = dialog.getBoundingClientRect();
  return event.target === dialog && (event.clientX < r.left || event.clientX >= r.right ||
    event.clientY < r.top || event.clientY >= r.bottom);
}
let pressedOutside = false;
dialog.onpointerdown = event => { pressedOutside = event.button === 0 && outside(event); };
dialog.onclick = event => {
  if (pressedOutside && outside(event)) dialog.close();
  pressedOutside = false;
};
</script>
</html>
